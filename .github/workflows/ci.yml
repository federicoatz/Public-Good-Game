name: CI

on:
  push:
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile check (catches syntax errors)
        run: python -m compileall -q .
      - name: oTree config check (create a demo session for each app)
        run: |
          rm -f db.sqlite3
          for name in $(python -c "import re; print(' '.join(re.findall(r\"name=['\\\"]([\\w-]+)['\\\"]\", open('settings.py').read())))"); do
            echo "Creating session: $name"
            otree create_session "$name" 2
          done
